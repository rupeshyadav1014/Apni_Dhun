<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apni Dhun — Music for your focus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Top Navigation Header -->
    <header class="header">
      <div class="brand">
        <div class="logo"><span>♪</span></div>
        <span class="brand-name">apni dhun</span>
      </div>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search a song, artist or mood..." autocomplete="off" />
        <span class="search-shortcut">⌘ K</span>
      </div>
      <div class="profile-avatar">AG</div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
      <!-- Dynamic Step-by-Step Selection Container -->
      <section id="flowContainer"></section>

      <!-- Track Listing Section -->
      <section class="tracks-section">
        <div class="section-header">
          <h2 id="resultsTitle">Select a language to get started</h2>
          <span id="status" class="status-badge">Audius API</span>
        </div>
        <div id="trackList" class="track-list"></div>
        <div id="emptyState" class="empty-state" hidden>No tracks found for this selection.</div>
      </section>
    </main>

    <!-- Bottom Audio Player Console -->
    <div class="player-bar">
      <div class="player-left">
        <div id="cover" class="cover-art">♫</div>
        <div class="track-info">
          <div id="nowTitle" class="now-title">Select a track</div>
          <div id="nowArtist" class="now-artist">Apni Dhun</div>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="shuffleBtn" class="control-btn" title="Shuffle">🔀</button>
          <button id="prevBtn" class="control-btn" title="Previous">⏮</button>
          <button id="playBtn" class="play-btn" title="Play/Pause">▶</button>
          <button id="nextBtn" class="control-btn" title="Next">⏭</button>
          <button id="repeatBtn" class="control-btn" title="Repeat">🔁</button>
        </div>
        <div class="progress-wrap">
          <span id="currentTime" class="time-label">0:00</span>
          <input type="range" id="progress" min="0" max="100" value="0" class="slider" />
          <span id="duration" class="time-label">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-wrap">
          <span class="volume-icon">🔊</span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.75" class="slider" />
        </div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
